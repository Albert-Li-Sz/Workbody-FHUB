name: workbody-fhub
services:
  workbody-fhub:
    image: ${WORKBODY_IMAGE:-ghcr.io/albert-li-sz/workbody-fhub:1.2.5}
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "127.0.0.1:${WB_DIRECT_PORT:-8788}:8788"
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      TZ: Asia/Shanghai
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      WB_WEB_PROXY: ${WB_WEB_PROXY:-}
      WB_WEB_PROXY_USERNAME: ${WB_WEB_PROXY_USERNAME:-}
      WB_WEB_PROXY_PASSWORD: ${WB_WEB_PROXY_PASSWORD:-}
      WB_HTTP_POOL_MAX: ${WB_HTTP_POOL_MAX:-128}
      WB_HTTP_POOL_PER_ROUTE: ${WB_HTTP_POOL_PER_ROUTE:-8}
      WB_HTTP_POOL_IDLE: ${WB_HTTP_POOL_IDLE:-60}
      WB_HTTP_MAX_CONNECTIONS: ${WB_HTTP_MAX_CONNECTIONS:-128}
      WB_SSE_HEARTBEAT_SECONDS: ${WB_SSE_HEARTBEAT_SECONDS:-15}
      WB_SQLITE_RETENTION_DAYS: ${WB_SQLITE_RETENTION_DAYS:-0}
      WB_TRUSTED_PROXIES: ${WB_TRUSTED_PROXIES:-nginx,127.0.0.1/32,::1/128}
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
  nginx:
    image: ${WORKBODY_NGINX_IMAGE:-ghcr.io/albert-li-sz/workbody-fhub-nginx:1.2.5}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      workbody-fhub:
        condition: service_healthy
    ports:
      - "${WB_HTTP_PORT:-80}:80"
      - "${WB_HTTPS_PORT:-443}:443"
    environment:
      TZ: Asia/Shanghai
      WB_TLS_MODE: ${WB_TLS_MODE:-auto}
      WB_PUBLIC_IP: ${WB_PUBLIC_IP:-}
      WB_TLS_DOMAINS: ${WB_TLS_DOMAINS:-}
      WB_ACME_EMAIL: ${WB_ACME_EMAIL:-}
      WB_ACME_STAGING: ${WB_ACME_STAGING:-0}
      WB_ACME_CHECK_SECONDS: ${WB_ACME_CHECK_SECONDS:-21600}
      WB_ACME_RETRY_SECONDS: ${WB_ACME_RETRY_SECONDS:-1800}
    volumes:
      - ./.tls:/etc/letsencrypt
      - ./.acme:/var/lib/letsencrypt
