name: workbody-fhub
services:
  workbody-fhub:
    image: ${WORKBODY_IMAGE:-ghcr.io/albert-li-sz/workbody-fhub:1.0.7}
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "0.0.0.0:8788:8788"
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      TZ: Asia/Shanghai
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      WB_WEB_PROXY: ${WB_WEB_PROXY:-}
      WB_WEB_PROXY_USERNAME: ${WB_WEB_PROXY_USERNAME:-}
      WB_WEB_PROXY_PASSWORD: ${WB_WEB_PROXY_PASSWORD:-}
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
