name: Refresh complete release checksums

# Explicit repair only. The image publication workflow is the automatic writer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Completed release tag (e.g. v1.1.2)"
        required: true
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    concurrency:
      group: release-assets-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Hash all assets after both architecture receipts exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/finalize_release.py "$RELEASE_TAG"
