name: Publish Workbody-FHUB image

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Verify the release tag matches the source version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        from wb_version import verify_artifacts
        print('release version:', verify_artifacts(tag=os.environ['RELEASE_TAG']))
        PY
    - name: Verify this release before publishing
      run: python tests/run_all.py
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Determine Docker images
      id: images
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        TARGETS="ghcr.io/${OWNER,,}/workbody-fhub"
        if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          TARGETS="$TARGETS
        ${DOCKERHUB_USER}/workbody-fhub"
        fi
        echo "list<<EOF" >> $GITHUB_OUTPUT
        echo "$TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "primary=ghcr.io/${OWNER,,}/workbody-fhub" >> $GITHUB_OUTPUT
    - name: Extract Docker metadata
      uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ steps.images.outputs.list }}
        flavor: latest=false
        labels: |
          org.opencontainers.image.licenses=Apache-2.0 AND MIT
        tags: |
          type=raw,value=${{ github.event.release.tag_name }}
          type=semver,pattern={{version}}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Verify the published image on both architectures
      env:
        IMAGE: ${{ steps.images.outputs.primary }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: python scripts/verify_image.py "$IMAGE:$RELEASE_TAG" --revision HEAD --pull --non-root
    - name: Promote verified stable images to latest
      if: ${{ !github.event.release.prerelease }}
      env:
        IMAGE_TARGETS: ${{ steps.images.outputs.list }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        while IFS= read -r target; do
          docker buildx imagetools create --tag "$target:latest" "$target:$RELEASE_TAG"
        done <<< "$IMAGE_TARGETS"
