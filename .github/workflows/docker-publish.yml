name: Publish Workbody-FHUB image

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Verify the release tag matches the source version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os, re
        from pathlib import Path
        source = Path('wb_proxy.py').read_text()
        version = re.search(r'"version"\s*:\s*"([^"]+)"', source).group(1)
        server = re.search(r'server_version\s*=\s*"Workbody-FHUB/([^"]+)"', source).group(1)
        assert version == server, 'source version strings disagree'
        assert os.environ['RELEASE_TAG'] in (version, 'v' + version), 'release tag differs from source version'
        PY
    - name: Verify this release before publishing
      run: python tests/run_all.py
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Determine Docker images
      id: images
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        TARGETS="ghcr.io/${OWNER,,}/workbody-fhub"
        if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          TARGETS="$TARGETS
        ${DOCKERHUB_USER}/workbody-fhub"
        fi
        echo "list<<EOF" >> $GITHUB_OUTPUT
        echo "$TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Extract Docker metadata
      uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ steps.images.outputs.list }}
        labels: |
          org.opencontainers.image.licenses=Apache-2.0 AND MIT
        tags: |
          type=raw,value=${{ github.event.release.tag_name }}
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
