name: Publish Workbody-FHUB images

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (e.g. v1.2.2)"
        required: true
        type: string
      reuse_images:
        description: "Verify and finish publishing existing versioned images"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-assets-${{ inputs.tag || github.event.release.tag_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.event.release.tag_name }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Verify the release tag matches the source version
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        python - <<'PY'
        import json, os, subprocess
        from wb_version import verify_artifacts
        print('release version:', verify_artifacts(tag=os.environ['RELEASE_TAG']))
        release = json.loads(subprocess.check_output([
            'gh', 'release', 'view', os.environ['RELEASE_TAG'],
            '--json', 'tagName,isDraft,isPrerelease'], text=True))
        if release['isDraft'] or release['tagName'] != os.environ['RELEASE_TAG']:
            raise ValueError('an already published matching release is required')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('commit=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
            output.write('prerelease=' + str(release['isPrerelease']).lower() + '\n')
        PY
    - name: Verify this release before publishing
      run: python tests/run_all.py
    - name: Package public source and migration tools
      run: python scripts/package_release.py --ref HEAD --output-dir release-source
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Determine Docker images
      id: images
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        TARGETS="ghcr.io/${OWNER,,}/workbody-fhub"
        NGINX_TARGETS="ghcr.io/${OWNER,,}/workbody-fhub-nginx"
        if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          TARGETS="$TARGETS
        ${DOCKERHUB_USER}/workbody-fhub"
          NGINX_TARGETS="$NGINX_TARGETS
        ${DOCKERHUB_USER}/workbody-fhub-nginx"
        fi
        echo "list<<EOF" >> $GITHUB_OUTPUT
        echo "$TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "primary=ghcr.io/${OWNER,,}/workbody-fhub" >> $GITHUB_OUTPUT
        echo "nginx_list<<EOF" >> $GITHUB_OUTPUT
        echo "$NGINX_TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "nginx_primary=ghcr.io/${OWNER,,}/workbody-fhub-nginx" >> $GITHUB_OUTPUT
    - name: Extract Docker metadata
      uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ steps.images.outputs.list }}
        flavor: latest=false
        labels: |
          org.opencontainers.image.licenses=Apache-2.0 AND MIT
          org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
        tags: |
          type=raw,value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
    - name: Build and push Docker image
      if: ${{ !inputs.reuse_images }}
      id: app_build
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Extract Nginx Docker metadata
      uses: docker/metadata-action@v5
      id: nginx_meta
      with:
        images: ${{ steps.images.outputs.nginx_list }}
        flavor: latest=false
        labels: |
          org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
        tags: |
          type=raw,value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
    - name: Build and push Nginx image
      if: ${{ !inputs.reuse_images }}
      uses: docker/build-push-action@v6
      id: nginx_build
      with:
        context: .
        file: deploy/nginx/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.nginx_meta.outputs.tags }}
        labels: ${{ steps.nginx_meta.outputs.labels }}
    - name: Verify the published image on both architectures
      env:
        IMAGE: ${{ steps.images.outputs.primary }}
      run: python scripts/verify_image.py "$IMAGE:$RELEASE_TAG" --revision HEAD --pull --non-root > app-verification.json
    - name: Verify Nginx startup and SSE on both architectures
      env:
        APP_IMAGE: ${{ steps.images.outputs.primary }}
        NGINX_IMAGE: ${{ steps.images.outputs.nginx_primary }}
      run: python scripts/verify_nginx_image.py "$NGINX_IMAGE:$RELEASE_TAG" --app-image "$APP_IMAGE:$RELEASE_TAG" --revision HEAD --pull > nginx-verification.json
    - name: Verify native and Compose upgrades with rollback
      env:
        APP_IMAGE: ${{ steps.images.outputs.primary }}
        NGINX_IMAGE: ${{ steps.images.outputs.nginx_primary }}
      run: |
        for version in 1.1.0 1.1.1 1.1.2 1.1.3 1.2.1; do
          docker pull "ghcr.io/albert-li-sz/workbody-fhub:$version"
          docker tag "ghcr.io/albert-li-sz/workbody-fhub:$version" "workbody-fhub:$version"
        done
        docker pull ghcr.io/albert-li-sz/workbody-fhub-nginx:v1.1.1
        docker pull ghcr.io/albert-li-sz/workbody-fhub-nginx:v1.1.2
        docker pull ghcr.io/albert-li-sz/workbody-fhub-nginx:v1.1.3
        docker pull ghcr.io/albert-li-sz/workbody-fhub-nginx:v1.2.1
        docker pull "$APP_IMAGE:$RELEASE_TAG"
        docker pull "$NGINX_IMAGE:$RELEASE_TAG"
        # Container-written private bind mounts belong to root on Linux. Exercise
        # the real updater with that same authority, retaining its 0700/0600 modes.
        sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
        sudo "$(command -v python)" scripts/verify_upgrade.py --archive "release-source/workbody-fhub-${RELEASE_TAG#v}-source.tar.gz" --image "$APP_IMAGE:$RELEASE_TAG" --nginx-image "$NGINX_IMAGE:$RELEASE_TAG" > migration-verification.txt
    - name: Promote verified stable images to latest
      if: ${{ steps.release.outputs.prerelease == 'false' }}
      env:
        IMAGE_TARGETS: |
          ${{ steps.images.outputs.list }}
          ${{ steps.images.outputs.nginx_list }}
      run: |
        while IFS= read -r target; do
          [ -n "$target" ] || continue
          docker buildx imagetools create --tag "$target:latest" "$target:$RELEASE_TAG"
        done <<< "$IMAGE_TARGETS"
    - name: Attach image receipts and refresh release checksums
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        APP_IMAGE: ${{ steps.images.outputs.primary }}
        NGINX_IMAGE: ${{ steps.images.outputs.nginx_primary }}
      run: |
        python - <<'PY'
        import json, os, pathlib, subprocess
        images = {}
        for name in ('APP', 'NGINX'):
            target = os.environ[name + '_IMAGE']
            digest = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect',
                target + ':' + os.environ['RELEASE_TAG'], '--format', '{{.Manifest.Digest}}'], text=True).strip()
            if not digest.startswith('sha256:') or len(digest) != 71:
                raise ValueError('registry returned an invalid manifest digest')
            images[name] = {'image': target, 'digest': digest}
        receipt = {'tag': os.environ['RELEASE_TAG'],
                   'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                   'platforms': ['linux/amd64', 'linux/arm64'],
                   'images': images}
        pathlib.Path('images.json').write_text(json.dumps(receipt, indent=2) + '\n')
        PY
        gh release upload "$RELEASE_TAG" images.json app-verification.json nginx-verification.json migration-verification.txt release-source/* --clobber
        python scripts/finalize_release.py "$RELEASE_TAG"
