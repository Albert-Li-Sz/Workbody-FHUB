name: tests

# Pushes are covered on main only; every other branch (and every pull request,
# including ones from forks) is covered by pull_request. Listing both events
# without the branch filter ran each update twice - two full windows + ubuntu
# matrices for the same commit.
on:
  push:
    branches: [main]
    # v* tags run the full matrix plus the tag == source version assertion
    # below, so a release cannot ship a tag that disagrees with the code.
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One failing version must not cancel the others: the point of the matrix
      # is to see which interpreter breaks.
      fail-fast: false
      matrix:
        include:
          # The README advertises Python 3.9+, so the floor is exercised on
          # Linux; the primary platform (Windows) runs the current release.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run every suite
        run: python tests/run_all.py

  # Release discipline (M6 F2, panel parity): a v* tag must match the version
  # defined in wb_version.py; runtime, image and install artifacts must agree
  # with that version. A tag carrying a -ci suffix is a rehearsal and skips only the
  # tag comparison (the source-consistency check still runs).
  version-assert:
    name: tag matches source version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert tag == source version
        run: |
          python - <<'PY'
          import os
          from wb_version import verify_artifacts
          tag = os.environ['GITHUB_REF_NAME']
          version = verify_artifacts(tag=None if tag.endswith('-ci') else tag)
          print('version assert OK:', version)
          PY
