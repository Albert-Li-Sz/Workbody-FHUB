name: Verify existing Workbody-FHUB image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        default: v1.0.1
      promote:
        description: Promote to latest only after every check passes
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate the published tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('a stable version tag is required')
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--json', 'isDraft,isPrerelease']))
          if release['isDraft'] or release['isPrerelease']:
              raise SystemExit('a published stable release is required')
          subprocess.run(['git', 'rev-parse', '--verify', tag + '^{commit}'], check=True)
          try:
              source = subprocess.check_output(['git', 'show', tag + ':wb_version.py'], stderr=subprocess.DEVNULL).decode()
              version = re.search(r'^VERSION\s*=\s*"([^"]+)"', source, re.M).group(1)
          except subprocess.CalledProcessError:
              source = subprocess.check_output(['git', 'show', tag + ':wb_proxy.py']).decode()
              version = re.search(r'"version"\s*:\s*"([^"]+)"', source).group(1)
          if tag != 'v' + version:
              raise SystemExit('tag differs from the release source version')
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release source, both architectures and ordinary UID
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/workbody-fhub"
          python scripts/verify_image.py "$IMAGE:$RELEASE_TAG" --revision "$RELEASE_TAG" --pull --non-root > image-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-verification
          path: image-verification.json
      - name: Promote the verified image to latest
        if: ${{ inputs.promote }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/workbody-fhub"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
